<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docsreader</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
<header id="bar">
  <button id="home" title="Library">&#9776;</button>
  <span id="title">docsreader</span>
  <span id="spacer"></span>
  <button id="tocBtn" hidden title="Contents">TOC</button>
  <button id="markBtn" hidden title="Bookmark this page or spot (B)">&#128278; Bookmark</button>
  <button id="notesBtn" hidden title="Highlights, notes and bookmarks">Notes</button>
  <button id="findBtn" hidden title="Search in book">Find</button>
  <button id="histBtn" hidden title="Reading history">History</button>
  <button id="setBtn" title="Display settings">Aa</button>
</header>

<main id="library">
  <section id="continue"></section>
  <input id="libSearch" type="search" placeholder="Search all your books…" autocomplete="off">
  <div id="libHits"></div>
  <div class="row">
    <h2>Library</h2>
    <label class="btn">Add books<input id="upload" type="file" accept=".epub,.pdf" multiple hidden></label>
  </div>
  <div id="shelf"></div>
  <section id="stats"></section>
</main>

<main id="reader" hidden>
  <article id="page"></article>
  <div id="pdfWrap" hidden></div>
  <footer id="foot">
    <button id="prev">&larr;</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="pct"></span>
    <button id="next">&rarr;</button>
  </footer>
</main>

<aside id="toc" hidden></aside>
<aside id="history" hidden></aside>
<aside id="notes" hidden></aside>
<aside id="find" hidden><input id="findInput" type="search" placeholder="Search this book…" autocomplete="off"><div id="findHits"></div></aside>
<div id="selbar" hidden>
  <div id="selBtns"><button id="hlBtn">Highlight</button> <button id="noteBtn">Add note</button></div>
  <div id="noteForm" hidden><textarea id="noteText" rows="3" placeholder="Write a note… (Ctrl+Enter to save)"></textarea>
    <div><button id="noteSave">Save</button> <button id="noteCancel">Cancel</button></div></div>
</div>
<div id="hlbar" hidden><button id="hlRemove">Remove highlight</button> <button id="hlNotes">Note</button></div>
<div id="toast" hidden></div>
<aside id="settings" hidden>
  <label>Theme
    <select id="theme"><option>light</option><option>sepia</option><option>dark</option></select></label>
  <label>Font
    <select id="font"><option value="serif">Serif</option><option value="sans">Sans</option><option value="dyslexic">Readable</option></select></label>
  <label>Size <input id="size" type="range" min="14" max="30" value="19"></label>
  <label>Line height <input id="lh" type="range" min="12" max="22" value="17"></label>
  <label>Width <input id="width" type="range" min="40" max="100" value="68"></label>
  <label><input id="focus" type="checkbox"> Focus mode</label>
</aside>
<script type="module" src="app.js"></script>
</body>
</html>
